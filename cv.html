<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV · Hernán Guerrero Aguilera</title>
  <meta name="robots" content="noindex">
  <!--
    Plantilla para generar los PDF de /cv a partir de data.js.
    Uso: cv.html?id=piso | barra | logistica | masaje  → Imprimir → Guardar como PDF
    (A4, márgenes "Ninguno", con "Gráficos de fondo" activado).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 0; }
    :root {
      --text: #1A1A1A; --text-2: #4A4C4F; --text-3: #7A7C7F; --line: #E3E2DC;
      --accent: #2C5F6E; --side: #1F4651; --side-2: #2C5F6E; --soft: #EEF3F4;
    }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; }
    body { font-family: "Manrope", Arial, sans-serif; color: var(--text); font-size: 9.3pt; line-height: 1.42; background: #fff; }
    h1, h2, h3, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }

    .page { width: 210mm; height: 297mm; display: grid; grid-template-columns: 66mm 1fr; grid-template-rows: 100%; overflow: hidden; }
    .side, .main { min-height: 0; overflow: hidden; }

    /* ---------- Columna lateral ---------- */
    .side { background: var(--side); color: #E8EEF0; padding: 14mm 8mm 12mm 9mm; display: flex; flex-direction: column; gap: 7mm; }
    .photo { width: 36mm; height: 36mm; border-radius: 50%; object-fit: cover; object-position: center 25%; border: 1.2mm solid rgba(255,255,255,.14); align-self: center; }
    .side h2 { font-size: 7.6pt; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #9CC2CC; padding-bottom: 2mm; margin-bottom: 3mm; border-bottom: 1px solid rgba(255,255,255,.16); }

    .contact li { display: grid; grid-template-columns: 5mm 1fr; align-items: center; gap: 2mm; font-size: 8.6pt; }
    .contact .email { font-size: 7.9pt; }
    .contact li + li { margin-top: 2.2mm; }
    .contact svg { width: 3.6mm; height: 3.6mm; color: #9CC2CC; }

    .tags { display: flex; flex-wrap: wrap; gap: 1.6mm; }
    .tag { font-size: 7.9pt; padding: .8mm 2.4mm; border-radius: 99px; background: rgba(255,255,255,.1); color: #F2F6F7; }

    .checks li { position: relative; padding-left: 4.5mm; font-size: 8.5pt; }
    .checks li + li { margin-top: 1.4mm; }
    .checks li::before { content: ""; position: absolute; left: 0; top: 1.6mm; width: 1.8mm; height: 1.8mm; border-radius: 50%; background: #9CC2CC; }

    .avail { margin-top: auto; background: rgba(255,255,255,.08); border-left: 1mm solid #9CC2CC; border-radius: 1.5mm; padding: 3mm 3.5mm; font-size: 8.3pt; }
    .avail b { display: block; color: #fff; font-size: 8.8pt; margin-bottom: .5mm; }

    /* ---------- Columna principal ---------- */
    .main { padding: 14mm 12mm 12mm 11mm; display: flex; flex-direction: column; }
    .name { font-size: 24pt; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
    .role { display: inline-block; margin-top: 3mm; padding: 1.2mm 3.2mm; background: var(--soft); color: var(--accent); font-weight: 700; font-size: 9.4pt; border-radius: 1.5mm; }
    .perfil { margin-top: 5mm; color: var(--text-2); font-size: 9.4pt; padding-left: 3.5mm; border-left: .8mm solid var(--accent); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5mm; margin-top: 5mm; }
    .stat { background: var(--soft); border-radius: 2mm; padding: 3mm 3.5mm; }
    .stat b { display: block; font-size: 13pt; font-weight: 800; color: var(--accent); letter-spacing: -.01em; line-height: 1.15; }
    .stat span { display: block; font-size: 7.9pt; color: var(--text-2); line-height: 1.3; margin-top: .6mm; }

    .block { margin-top: 6mm; }
    .block h2 { display: flex; align-items: center; gap: 3mm; font-size: 8pt; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 3.5mm; }
    .block h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .timeline { position: relative; padding-left: 5mm; }
    .timeline::before { content: ""; position: absolute; left: 1.1mm; top: 1.5mm; bottom: 1.5mm; width: 1px; background: var(--line); }
    .job { position: relative; break-inside: avoid; }
    .job + .job { margin-top: 4mm; }
    .job::before { content: ""; position: absolute; left: -5mm; top: 1.2mm; width: 2.4mm; height: 2.4mm; border-radius: 50%; background: #fff; border: .6mm solid var(--accent); }
    .job__top { display: flex; justify-content: space-between; align-items: baseline; gap: 3mm; }
    .job__puesto { font-weight: 700; font-size: 10pt; }
    .job__periodo { font-size: 7.8pt; font-weight: 600; color: var(--accent); background: var(--soft); padding: .5mm 2mm; border-radius: 99px; white-space: nowrap; }
    .job__empresa { font-size: 8.8pt; font-weight: 600; color: var(--text-3); margin: .4mm 0 1.4mm; }
    .job li { position: relative; padding-left: 3.5mm; color: var(--text-2); font-size: 8.9pt; }
    .job li + li { margin-top: .5mm; }
    .job li::before { content: ""; position: absolute; left: 0; top: 2.1mm; width: 1.6mm; height: .35mm; background: var(--accent); }

    .certs { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; }
    .cert { padding: 2.2mm 3mm; border: 1px solid var(--line); border-radius: 1.5mm; break-inside: avoid; }
    .cert b { display: block; font-size: 8.8pt; }
    .cert span { display: block; font-size: 7.8pt; color: var(--text-3); line-height: 1.35; }

    .others li { display: grid; grid-template-columns: 1fr auto; gap: 3mm; padding: 1.6mm 0; border-bottom: 1px solid var(--line); font-size: 8.8pt; }
    .others li:first-child { padding-top: 0; }
    .others b { font-weight: 700; }
    .others span { color: var(--text-3); }
    .others em { font-style: normal; font-size: 7.9pt; font-weight: 600; color: var(--accent); white-space: nowrap; }

    .foot { margin-top: auto; padding-top: 4mm; font-size: 7.8pt; color: var(--text-3); }

    @media screen { body { background: #E9E8E3; padding: 24px 0; } .page { margin: 0 auto; box-shadow: 0 2px 20px rgba(0,0,0,.12); } }
  </style>
</head>
<body>
  <div class="page" id="cv"></div>

  <script src="data.js"></script>
  <script>
    const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const id = new URLSearchParams(location.search).get("id") || "piso";
    const rol = SECTORES.flatMap((s) => s.roles).find((r) => r.id === id) || SECTORES[0].roles[0];

    const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const ICONOS = {
      tel: icon('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'),
      mail: icon('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>'),
      pin: icon('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'),
    };

    const trabajos = rol.experiencia.map((j) => `
      <li class="job">
        <div class="job__top">
          <p class="job__puesto">${esc(j.puesto)}</p>
          ${j.periodo ? `<span class="job__periodo">${esc(j.periodo)}</span>` : ""}
        </div>
        <p class="job__empresa">${esc([j.empresa, j.lugar, j.nota].filter(Boolean).join(" · "))}</p>
        <ul>${j.tareas.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
      </li>`).join("");

    const formacion = rol.formacion
      ? `<section class="block"><h2>Formación y certificaciones</h2><div class="certs">${rol.formacion.map((f) =>
          `<div class="cert"><b>${esc(f.titulo)}</b><span>${esc(f.centro)}${f.horas ? `<br>${esc(f.horas)}` : ""}</span></div>`).join("")}</div></section>`
      : "";

    // Trabajos de los otros perfiles, en una línea cada uno
    const otros = SECTORES.flatMap((s) => s.roles)
      .filter((r) => r.id !== rol.id)
      .flatMap((r) => r.experiencia)
      .map((j) => `<li><p><b>${esc(j.puesto)}</b> <span>· ${esc([j.empresa, j.lugar].filter(Boolean).join(", "))}</span></p><em>${esc(j.periodo)}</em></li>`)
      .join("");

    document.title = `CV ${rol.titulo} · ${PERFIL.nombre}`;
    document.getElementById("cv").innerHTML = `
      <aside class="side">
        <img class="photo" src="img/hernan.jpg" alt="">
        <section>
          <h2>Contacto</h2>
          <ul class="contact">
            <li>${ICONOS.tel}<span>${esc(PERFIL.telefonoVisible)}</span></li>
            <li>${ICONOS.mail}<span class="email">${esc(PERFIL.email).replace("@", "@<wbr>")}</span></li>
            <li>${ICONOS.pin}<span>${esc(PERFIL.ciudad)}</span></li>
          </ul>
        </section>
        <section>
          <h2>Competencias</h2>
          <div class="tags">${rol.competencias.map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div>
        </section>
        <section>
          <h2>Fortalezas</h2>
          <ul class="checks">${FORTALEZAS.map((f) => `<li>${esc(f.titulo)}</li>`).join("")}</ul>
        </section>
        <div class="avail"><b>Disponibilidad</b>${esc(PERFIL.disponibilidad)}</div>
      </aside>
      <main class="main">
        <h1 class="name">${esc(PERFIL.nombre)}</h1>
        <p><span class="role">${esc(rol.titulo)}</span></p>
        <p class="perfil">${esc(rol.perfil)}</p>
        ${rol.destacados ? `<div class="stats">${rol.destacados.map((d) => `<div class="stat"><b>${esc(d.valor)}</b><span>${esc(d.texto)}</span></div>`).join("")}</div>` : ""}
        <section class="block"><h2>Experiencia profesional</h2><ul class="timeline">${trabajos}</ul></section>
        ${formacion}
        <section class="block" id="otros"><h2>Otra experiencia</h2><ul class="others">${otros}</ul></section>
        <p class="foot">Referencias disponibles a solicitud.</p>
      </main>`;

    // "Otra experiencia" se recorta línea a línea hasta que todo quepa en la página
    document.fonts.ready.then(() => {
      const main = document.querySelector(".main");
      const bloque = document.getElementById("otros");
      while (main.scrollHeight > main.clientHeight && bloque.querySelector("li")) {
        bloque.querySelector("li:last-child").remove();
      }
      if (!bloque.querySelector("li")) bloque.remove();
    });
  </script>
</body>
</html>
